name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag matches the workspace version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  linux:
    name: Linux x86_64
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream build-essential dbus desktop-file-utils file \
            libasound2-dev libass-dev libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev libfontconfig1-dev libjack-jackd2-dev liblua5.2-dev \
            libpipewire-0.3-dev libplacebo-dev libpulse-dev libswresample-dev libswscale-dev \
            meson ninja-build pkg-config
      - name: Build libmpv
        run: rust/packaging/appimage/build-libmpv.sh
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        timeout-minutes: 30
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build the AppImage
        run: rust/packaging/appimage/build-appimage.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: dist/Cadence-*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  macos:
    name: macOS arm64
    needs: tag
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: brew install dylibbundler mpv
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        timeout-minutes: 30
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build the app bundle
        run: rust/packaging/macos/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: rust/target/macos/Cadence-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish the release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check that every platform has its asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/Cadence-$version-macos-arm64.zip"
          test -f "dist/Cadence-$version-x86_64.AppImage"
      - name: Generate the checksums
        working-directory: dist
        run: sha256sum -- Cadence-* > SHA256SUMS
      - name: Create a draft with every asset
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "Cadence $GITHUB_REF_NAME"
      - name: Make the release visible
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
