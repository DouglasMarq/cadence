[package]
name = "cadence-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
cadence-api.workspace = true
cadence-core.workspace = true
cadence-youtube.workspace = true
image = { workspace = true, features = ["jpeg", "png", "webp", "gif", "bmp"] }
keyring-core = "1.0.1"
lru.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror.workspace = true
tokio.workspace = true
toml = "1.1.8"
tracing.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
